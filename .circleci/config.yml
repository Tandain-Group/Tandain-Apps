version: 2.1

orbs:
  android: circleci/android@3.1.0

jobs:
  unit-test:
    docker:
      - image: cimg/android:2022.08  # ✅ Using a valid Android Docker image
    steps:
      - checkout
      - run:
          name: Gradle Cache Prep
          command: chmod +x ./gradlew && ./gradlew dependencies || true
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle" }}
            - gradle-
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Run Unit Tests
          command: ./gradlew testDebugUnitTest
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-{{ checksum "build.gradle" }}

  android-test:
    docker:
      - image: cimg/android:2022.08
    steps:
      - checkout
      - run:
          name: Install System Images
          command: sdkmanager "system-images;android-30;google_apis;x86" "system-images;android-29;google_apis;x86"
      - run:
          name: Start Emulator and Run Connected Tests
          command: |
            ./gradlew connectedDebugAndroidTest
          environment:
            ADB_INSTALL_TIMEOUT: '10'
      - run:
          name: Save test results
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/build/outputs/androidTest-results/.*xml" -exec cp {} ~/test-results/junit/ \;
      - store_test_results:
          path: ~/test-results
      - store_artifacts:
          path: ~/test-results/junit

  release-build:
    docker:
      - image: cimg/android:2022.08
    steps:
      - checkout
      - run:
          name: Gradle Cache Prep
          command: chmod +x ./gradlew && ./gradlew dependencies || true
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle" }}
            - gradle-
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Assemble release build
          command: ./gradlew assembleRelease
      - store_artifacts:
          path: app/build/outputs/apk/release
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-{{ checksum "build.gradle" }}

workflows:
  test-and-build:
    jobs:
      - unit-test
      - android-test:
          filters:
            branches:
              ignore: main
      - android-test:
          matrix:
            alias: android-test-all
            parameters:
              system-image:
                - system-images;android-30;google_apis;x86
                - system-images;android-29;google_apis;x86
          name: android-test-all
          filters:
            branches:
              only: main
      - release-build:
          requires:
            - unit-test
            - android-test-all
