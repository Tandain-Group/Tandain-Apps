version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2023.02 # Use a recent CircleCI Android image
    resource_class: large
    environment:
      JAVA_VERSION: 11 # Set the Java version
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx4g'" # Optimize Gradle memory usage

jobs:
  build:
    executor: android-executor

    steps:
      - checkout

      - run:
          name: Grant Execute Permission for Gradlew
          command: chmod +x gradlew

      - run:
          name: Build Project
          command: ./gradlew assembleDebug

      - run:
          name: Run Unit Tests
          command: ./gradlew testDebugUnitTest

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
