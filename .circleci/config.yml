version: 2.1

orbs:
  android: circleci/android@2.1.2 # Official Android orb for CI/CD

jobs:
  build_and_test:
    executor:
      name: android/android
      tag: 2023.09.1 # Android SDK version
    working_directory: ~/project
    steps:
      - checkout # Pull code from repository

      # Restore Gradle cache to speed up builds
      - android/restore-gradle-cache

      # Run unit tests
      - run:
          name: Run Unit Tests
          command: ./gradlew test

      # Build debug APK
      - run:
          name: Build APK
          command: ./gradlew assembleDebug

      # Save APK as build artifact
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk

      # Save test results
      - store_test_results:
          path: app/build/test-results

workflows:
  main_workflow:
    jobs:
      - build_and_test

